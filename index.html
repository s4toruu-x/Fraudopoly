<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fraudopoly</title>
    <meta
      name="description"
      content="Pull and collect names from a Discord server, plus random names. 10 pulls per hour."
    />
    <meta property="og:title" content="Fraudopoly" />
    <meta
      property="og:description"
      content="Pull and collect names from a Discord server, plus random names. 10 pulls per hour."
    />
    <meta property="og:type" content="website" />
    <script>
      // Applies the saved theme before the first paint; src/lib/theme.ts takes over after.
      try {
        var saved = localStorage.getItem("fraudopoly.theme");
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Fraudopoly needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
